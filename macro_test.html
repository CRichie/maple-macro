<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>按键记录测试</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#192b44;font-family:"Microsoft YaHei",system-ui,sans-serif}main{max-width:1000px;padding:36px 24px;margin:auto}a{color:#456bc0;text-decoration:none;font-size:14px}h1{font-size:27px;margin:22px 0 8px}p{line-height:1.7;color:#65748b;margin:6px 0}.panel{background:#fff;border:1px solid #e1e8f0;border-radius:16px;padding:22px;margin-top:20px}.focus{background:#edf4ff;border:1px solid #c7dafc;border-radius:10px;padding:15px;color:#35537e}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}button{border:0;border-radius:9px;padding:10px 15px;background:#e6ecf6;color:#2d456a;font-weight:700;cursor:pointer}button.primary{background:#355fc5;color:#fff}.stat{margin-left:auto;color:#65748b;font-size:13px}.tablewrap{max-height:55vh;overflow:auto;border:1px solid #e5eaf2;border-radius:10px}table{border-collapse:collapse;width:100%;text-align:left;font-size:14px}th{position:sticky;top:0;background:#f7f9fc;color:#67768d;font-size:12px}th,td{padding:11px 14px;border-bottom:1px solid #edf0f5}td.key{font-weight:700;color:#264c9b}.empty{padding:25px;color:#8a97a9;text-align:center;font-size:14px}footer{font-size:12px;color:#7b8798;margin-top:18px;line-height:1.7}
</style></head><body><main>
<a id="back" href="#">← 返回配置</a><h1>按键记录测试</h1><p>记录这个页面收到的按键事件和相邻事件的时间间隔。</p>
<div class="panel"><div class="focus" id="focus">点击此页面并保持在前台，然后按 F8 启动宏。按 F9 停止宏。</div><div class="controls"><button id="record" class="primary">暂停记录</button><button id="clear">清空记录</button><button id="download">导出 CSV</button><span class="stat" id="stat">已记录 0 条</span></div><div class="tablewrap"><table><thead><tr><th>序号</th><th>时间</th><th>按键</th><th>事件</th><th>间隔（毫秒）</th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty">等待按键事件…</div></div></div>
<footer>仅记录此页面位于前台且获得焦点时浏览器收到的事件，不监控游戏窗口。间隔是相对于上一条按下或松开事件的时间；长按产生的重复按下不计入。浏览器或操作系统可能拦截部分按键。</footer></main>
<script>
const token=new URL(location.href).searchParams.get('token');document.querySelector('#back').href='/?token='+encodeURIComponent(token);
let recording=true,last=null,events=[];const rows=document.querySelector('#rows'),stat=document.querySelector('#stat'),empty=document.querySelector('#empty');
function add(e){if(!recording||e.repeat)return;if(e.target.closest('button,a,input,textarea,select'))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','PageUp','PageDown','Home','End'].includes(e.key))e.preventDefault();const now=performance.now(),delta=last===null?null:Math.max(0,now-last);last=now;const entry={number:events.length+1,time:new Date().toLocaleTimeString('zh-CN',{hour12:false})+'.'+String(new Date().getMilliseconds()).padStart(3,'0'),key:e.key===' '?'Space':e.key,code:e.code,type:e.type==='keydown'?'按下':'松开',delta:delta===null?'':delta.toFixed(1)};events.push(entry);const tr=document.createElement('tr');for(const [k,v] of Object.entries({number:entry.number,time:entry.time,key:entry.key+' ('+entry.code+')',type:entry.type,delta:entry.delta||'—'})){const td=document.createElement('td');td.textContent=v;if(k==='key')td.className='key';tr.appendChild(td)}rows.prepend(tr);empty.hidden=true;stat.textContent=`已记录 ${events.length} 条`}
window.addEventListener('keydown',add);window.addEventListener('keyup',add);
document.querySelector('#record').onclick=e=>{recording=!recording;last=null;e.target.textContent=recording?'暂停记录':'继续记录';e.target.classList.toggle('primary',recording);e.target.blur()};
document.querySelector('#clear').onclick=e=>{events=[];last=null;rows.replaceChildren();empty.hidden=false;stat.textContent='已记录 0 条';e.target.blur()};
document.querySelector('#download').onclick=e=>{const quote=v=>'"'+String(v).replaceAll('"','""')+'"';const lines=[['序号','时间','按键','代码','事件','间隔毫秒'],...events.map(x=>[x.number,x.time,x.key,x.code,x.type,x.delta])].map(row=>row.map(quote).join(','));const url=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='按键记录.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);e.target.blur()};
window.addEventListener('focus',()=>document.querySelector('#focus').textContent='页面已获得焦点，正在等待按键。按 F8 启动、F9 停止宏。');window.addEventListener('blur',()=>{document.querySelector('#focus').textContent='页面不在前台，当前无法记录。请切回本页面。';last=null});
</script></body></html>
